<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>quorum</title>
    <link rel="stylesheet" href="../styles.css" />
    <script type="module" src="../index.js"></script>
    <style>
      /* Fixed desktop rails, never reflowed (requirements §1.3). Every value is
         a token — a literal here is a check failure, not a matter of taste. */
      /* Vertical only. `overflow: hidden` would clip the fixed rails in a
         narrow window and make the right of the page unreachable — which is
         not "never reflowed", it is "never reachable". */
      body { height: 100vh; overflow-y: hidden; overflow-x: auto; }
      .app { display: flex; height: 100vh; }

      .rail { width: var(--rail-nav); flex: 0 0 auto; border-right: var(--border-width) solid var(--line-1); display: flex; flex-direction: column; align-items: center; padding-top: var(--sp-5); gap: var(--sp-5); }
      .mark { font: var(--type-heading); letter-spacing: var(--ls-tight); }
      .mark b { color: var(--brass-500); font-weight: inherit; }

      .side { width: var(--rail-sidebar); flex: 0 0 auto; border-right: var(--border-width) solid var(--line-1); display: flex; flex-direction: column; }
      .brand { padding: var(--sp-5); }
      .brand .wordmark { font: var(--fw-semibold) var(--fs-17)/var(--lh-snug) var(--font-sans); letter-spacing: var(--ls-tight); }
      .brand .wordmark b { color: var(--brass-500); font-weight: inherit; }
      .brand .where { font: var(--type-mono); color: var(--text-faint); margin-top: var(--sp-1); }
      .group-label { font: var(--type-label); letter-spacing: var(--ls-caps); text-transform: uppercase; color: var(--text-faint); padding: 0 var(--sp-5) var(--sp-3); }

      main { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; }
      .head { height: var(--header-h); flex: 0 0 auto; border-bottom: var(--border-width) solid var(--line-1); display: flex; align-items: center; padding: 0 var(--sp-7); }
      .body { flex: 1 1 auto; min-height: 0; display: flex; }
      /* The stream scrolls; the composer does not. It is pinned at the foot of
         this column rather than floating, so it never covers the last message. */
      .column { flex: 1 1 auto; min-width: 0; min-height: 0; display: flex; flex-direction: column; }
      .stream { flex: 1 1 auto; min-width: 0; min-height: 0; overflow-y: auto; padding: var(--sp-5) 0; }
      .side-roster { width: var(--rail-roster); flex: 0 0 auto; border-left: var(--border-width) solid var(--line-1); overflow-y: auto; padding: var(--sp-5); }

      /* Views own their internals; these are the classes they emit. */
      .rooms { display: flex; flex-direction: column; }
      .room { appearance: none; background: none; border: none; border-left: var(--border-width-accent) solid transparent; color: var(--text-muted); font: var(--type-body); text-align: left; display: flex; align-items: center; gap: var(--sp-3); padding: var(--sp-3) var(--sp-5); cursor: pointer; transition: var(--transition-hover); }
      .room:hover { background: var(--surface-hover); }
      /* Occupants under the open room (#56) — existing text styles, indented
         off the room row's own padding scale. */
      .occupants-toggle { appearance: none; background: none; border: none; cursor: pointer; text-align: left; font: var(--type-label); letter-spacing: var(--ls-caps); color: var(--text-faint); padding: var(--sp-2) var(--sp-5) var(--sp-2) var(--sp-7); }
      .occupants-toggle:hover { color: var(--text-muted); }
      .occupant { font: var(--type-mono); color: var(--text-muted); padding: var(--sp-1) var(--sp-5) var(--sp-1) var(--sp-8); }
      .room.open { border-left-color: var(--brass-500); background: var(--surface-selected); font: var(--type-body-strong); color: var(--text-body); }
      .hash { color: var(--text-faint); }
      .rule-tag { margin-left: auto; font: var(--type-label); letter-spacing: var(--ls-caps); color: var(--text-faint); }

      /* The other screens, reachable from here (§1.3 lists five). */
      .screens { margin-top: auto; display: flex; flex-direction: column; padding: var(--sp-5) 0; border-top: var(--border-width) solid var(--line-1); }
      .screen-link { display: block; padding: var(--sp-3) var(--sp-5); font: var(--type-body); color: var(--text-muted); border-bottom: none; }
      .screen-link:hover { background: var(--surface-hover); color: var(--text-body); }
      .screen-link.accent { color: var(--text-accent); font: var(--type-body-strong); }

      .topbar { display: flex; align-items: center; gap: var(--sp-4); width: 100%; }
      .topbar-room { font: var(--type-subheading); }
      .topbar-topic { font: var(--type-meta); color: var(--text-meta); }
      .topbar-right { margin-left: auto; display: flex; align-items: center; gap: var(--sp-5); }
      .rule-pill { font: var(--type-mono); color: var(--text-meta); border: var(--border-width) solid var(--line-2); border-radius: var(--radius-pill); padding: var(--sp-1) var(--sp-4); white-space: nowrap; }
      .feed { font: var(--type-label); letter-spacing: var(--ls-caps); text-transform: uppercase; }
      .feed-live { color: var(--phase-converged); }
      /* No pulse. Motion announces arrival and phase change, nothing else —
         a connection label is neither, and the hue already says it. */
      .feed-reconnecting { color: var(--phase-proposed); }

      .stack-panel { display: flex; flex-direction: column; gap: var(--sp-7); }
      .panel-section { display: flex; flex-direction: column; gap: var(--sp-4); }
      .label { font: var(--type-label); letter-spacing: var(--ls-caps); text-transform: uppercase; color: var(--text-faint); }
      .chips { display: flex; flex-direction: column; gap: var(--sp-3); align-items: flex-start; }
      .quiet { font: var(--type-mono); color: var(--text-faint); }
      .claim { border-left: var(--border-width-accent) solid var(--line-strong); padding-left: var(--sp-4); display: flex; flex-direction: column; gap: var(--sp-2); margin-bottom: var(--sp-4); }
      .claim-scope { font: var(--type-mono-strong); }
      .claim-purpose { font: var(--type-mono); color: var(--text-meta); }
      .claim-foot { display: flex; align-items: center; gap: var(--sp-4); flex-wrap: wrap; }
      .empty { font: var(--type-body); color: var(--text-meta); padding: var(--sp-7); max-width: var(--measure-message); }

      /* Room during deliberation (§1.3; design 0.4.0 StreamBanner): the chip
         carries the open phase, the button is the one navigation the state
         allows. The dot does not pulse — the motion tokens stop at
         --dur-slow and a pulse period has no token (QUESTIONS.md Q13). */
      .banner { position: sticky; top: 0; z-index: 2; display: flex; align-items: center; gap: var(--sp-6); padding: var(--sp-4) var(--sp-7); background: var(--ink-800); border-bottom: var(--border-width) solid var(--line-2); }
      .banner-chip { flex: 0 0 auto; display: inline-flex; align-items: center; gap: var(--sp-3); padding: var(--sp-1) var(--sp-4); border-radius: var(--radius-sm); border: var(--border-width) solid currentColor; font: var(--type-label); letter-spacing: var(--ls-caps); text-transform: uppercase; white-space: nowrap; }
      .banner-dot { width: var(--sp-2); height: var(--sp-2); border-radius: var(--radius-pill); background: currentColor; }
      .banner-copy { font: var(--type-mono); color: var(--text-meta); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
      .banner-deadline { flex: 0 0 auto; font: var(--type-mono); white-space: nowrap; }
      .banner-open { margin-left: auto; appearance: none; background: var(--brass-500); color: var(--fg-on-accent); border: none; border-radius: var(--radius-md); font: var(--type-mono-strong); padding: var(--sp-2) var(--sp-4); cursor: pointer; white-space: nowrap; transition: var(--transition-hover); }

      /* The deliberation overlay (design 0.4.0 DeliberationOverlay). Sized by
         inset rather than the mock's fixed pixels — the overlay's designed
         width has no token (QUESTIONS.md Q13). */
      .ov-scrim { position: fixed; inset: 0; z-index: 10; display: flex; align-items: stretch; justify-content: center; padding: var(--sp-8); background: var(--scrim); backdrop-filter: var(--blur-scrim); animation: q-arrive var(--dur-slow) var(--ease-out); }
      .ov-panel { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; overflow: hidden; background: var(--surface-app); border: var(--border-width) solid var(--line-2); border-top: var(--border-width-accent) solid var(--line-2); border-radius: var(--radius-lg); box-shadow: var(--shadow-overlay); }
      .ov-head { flex: 0 0 auto; max-height: 55%; overflow-y: auto; padding: var(--sp-6) var(--sp-7); border-bottom: var(--border-width) solid var(--line-1); display: flex; flex-direction: column; gap: var(--sp-5); }
      .ov-headrow { display: flex; align-items: center; gap: var(--sp-5); flex-wrap: wrap; }
      .ov-right { margin-left: auto; }
      .ov-pill { font: var(--type-mono-strong); border: var(--border-width) solid currentColor; border-radius: var(--radius-pill); padding: var(--sp-1) var(--sp-4); white-space: nowrap; }
      .ov-back { appearance: none; background: transparent; border: var(--border-width) solid var(--line-2); border-radius: var(--radius-md); color: var(--text-muted); font: var(--type-mono-strong); padding: var(--sp-2) var(--sp-4); cursor: pointer; transition: var(--transition-hover); }
      .ov-back:hover { color: var(--text-body); border-color: var(--line-strong); }
      .ov-question { margin: 0; font: var(--type-heading); letter-spacing: var(--ls-tight); max-width: var(--measure-record); }
      .ov-meta { display: flex; align-items: center; gap: var(--sp-5); flex-wrap: wrap; font: var(--type-mono); color: var(--text-meta); }
      .ov-meta-item { display: inline-flex; align-items: center; gap: var(--sp-3); }
      .ov-record { flex: 1 1 auto; min-height: 0; overflow-y: auto; padding: var(--sp-7); display: flex; flex-direction: column; gap: var(--sp-6); }
      .ov-body { flex: 1 1 auto; min-height: 0; overflow: hidden; display: flex; }
      .ov-challenges { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; border-right: var(--border-width) solid var(--line-1); }
      .ov-challenge-head { padding: var(--sp-5) var(--sp-7) var(--sp-3); display: flex; align-items: center; gap: var(--sp-4); }
      .ov-challenge-rows { flex: 1 1 auto; overflow-y: auto; padding-bottom: var(--sp-5); }
      .ov-composer { flex: 0 0 auto; }
      .ov-window-closed { flex: 0 0 auto; border-top: var(--border-width) solid var(--line-1); padding: var(--sp-5) var(--sp-7); }
      .ov-ballot { flex: 0 0 auto; width: calc(var(--rail-roster) + var(--sp-9)); padding: var(--sp-6); overflow-y: auto; display: flex; flex-direction: column; gap: var(--sp-7); background: var(--surface-panel); }
      .ov-options { display: flex; flex-direction: column; gap: var(--sp-3); }
      .ov-cast { margin-top: var(--sp-5); width: 100%; appearance: none; padding: var(--sp-4) var(--sp-5); border-radius: var(--radius-md); border: none; cursor: pointer; background: var(--brass-500); color: var(--fg-on-accent); font: var(--type-body-strong); transition: var(--transition-hover); }
      .ov-cast:disabled { background: var(--ink-600); color: var(--text-faint); cursor: default; }
      .ov-notice { margin-top: var(--sp-4); font: var(--type-mono); color: var(--phase-failed); border-left: var(--border-width-accent) solid var(--phase-failed); padding-left: var(--sp-4); }
      .ov-gap { margin-bottom: var(--sp-4); }
      .ov-gap-t { margin-top: var(--sp-4); }
      .ov-full { color: var(--phase-converged); }
      .ov-roster { display: flex; flex-direction: column; gap: var(--sp-4); }
      .ov-voter { display: flex; flex-direction: column; gap: var(--sp-2); align-items: stretch; }
      .ov-resolve { margin-top: auto; appearance: none; padding: var(--sp-4) var(--sp-5); border-radius: var(--radius-md); background: transparent; border: var(--border-width) solid var(--brass-600); color: var(--text-accent); font: var(--type-mono-strong); cursor: pointer; transition: var(--transition-hover); }

      /* No breakpoint, deliberately. "Fixed desktop rails, never reflowed"
         (requirements §1.3) means the page does not respond — a narrow window
         gets a horizontal scrollbar, which is the honest outcome. A
         too-narrow notice would need a width nobody designed, and a media
         query cannot read a custom property, so it could not be derived from
         the rails either. See QUESTIONS.md Q11. */
    </style>
  </head>
  <body>
    <div class="app">
      <div class="rail">
        <span class="mark">q<b>.</b></span>
      </div>

      <div class="side">
        <div class="brand">
          <div class="wordmark">quorum<b>.</b></div>
          <div class="where">127.0.0.1 · local</div>
        </div>
        <div class="group-label">rooms</div>
        <div id="sidebar"></div>
        <div class="screens">
          <div class="group-label">elsewhere</div>
          <a class="screen-link" href="dm.html">Direct messages</a>
          <a class="screen-link" href="records.html">Decision history</a>
          <a class="screen-link accent" href="connect.html">+ Connect an agent</a>
        </div>
      </div>

      <main>
        <div class="head" id="topbar"></div>
        <div class="body">
          <div class="column">
            <div class="stream" id="stream"></div>
            <div id="composer"></div>
          </div>
          <div class="side-roster" id="roster"></div>
        </div>
      </main>
    </div>

    <!-- The deliberation overlay mounts here while one is open (§1.3). -->
    <div id="overlay"></div>

    <script type="module">
      import { mountRoom } from './app/room.js';

      // The room in the query string, so a link to a room is a link.
      const room = new URLSearchParams(location.search).get('room') ?? 'protocol';
      document.title = `#${room} · quorum`;

      mountRoom({ room }).catch((error) => {
        // Say what failed and what to do. Never a bare error, and never a
        // spinner that waits forever on something that already gave up.
        document.getElementById('stream').replaceChildren(
          Object.assign(document.createElement('div'), {
            className: 'empty',
            textContent: `Could not open #${room}: ${error.message}. Check the server is running, then reload.`,
          }),
        );
      });
    </script>
  </body>
</html>
